<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="pawGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8BBD0"/>
      <stop offset="100%" stop-color="#F48FB1"/>
    </linearGradient>
    <linearGradient id="toeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </linearGradient>
  </defs>

  <!-- 主肉垫 -->
  <ellipse cx="96" cy="120" rx="28" ry="22" fill="url(#pawGrad)"/>

  <!-- 四个脚趾 -->
  <!-- 左上 -->
  <ellipse cx="54" cy="62" rx="13" ry="15" fill="url(#toeGrad)" transform="rotate(-25 54 62)"/>
  <!-- 左上偏右 -->
  <ellipse cx="74" cy="48" rx="12" ry="14" fill="url(#toeGrad)" transform="rotate(-10 74 48)"/>
  <!-- 右上偏左 -->
  <ellipse cx="118" cy="48" rx="12" ry="14" fill="url(#toeGrad)" transform="rotate(10 118 48)"/>
  <!-- 右上 -->
  <ellipse cx="138" cy="62" rx="13" ry="15" fill="url(#toeGrad)" transform="rotate(25 138 62)"/>
</svg>
