<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E8D5F5"/>
      <stop offset="50%" stop-color="#D4B8E8"/>
      <stop offset="100%" stop-color="#C9A0DC"/>
    </radialGradient>
    <radialGradient id="pawCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8BBD0"/>
      <stop offset="100%" stop-color="#F48FB1"/>
    </radialGradient>
    <radialGradient id="pawPad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#9C7CB0" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="240" r="220" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Main paw pad -->
  <ellipse cx="256" cy="320" rx="75" ry="55" fill="url(#pawCenter)" opacity="0.9"/>

  <!-- Toe pads (4) -->
  <ellipse cx="150" cy="190" rx="32" ry="38" fill="url(#pawPad)" transform="rotate(-30 150 190)"/>
  <ellipse cx="200" cy="145" rx="30" ry="36" fill="url(#pawPad)" transform="rotate(-10 200 145)"/>
  <ellipse cx="312" cy="145" rx="30" ry="36" fill="url(#pawPad)" transform="rotate(10 312 145)"/>
  <ellipse cx="362" cy="190" rx="32" ry="38" fill="url(#pawPad)" transform="rotate(30 362 190)"/>

  <!-- Tiny sparkles -->
  <circle cx="100" cy="100" r="6" fill="#E1BEE7" opacity="0.7"/>
  <circle cx="400" cy="80" r="5" fill="#F8BBD0" opacity="0.7"/>
  <circle cx="420" cy="280" r="4" fill="#E1BEE7" opacity="0.6"/>
  <circle cx="90" cy="350" r="5" fill="#F8BBD0" opacity="0.6"/>
</svg>
